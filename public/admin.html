<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投稿审核 · 宇宙奶龙大学</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080b1a">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body class="admin">

<div class="flow" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="frost" aria-hidden="true"></div>

<div class="wrap">

  <header class="head">
    <h1>投稿审核</h1>
    <p>游客提交的内容先进这里，你点「发布」才会进仓库。</p>
  </header>

  <!-- 登录 -->
  <section class="step" id="gate">
    <div class="step-head"><span class="num">1</span><h2>用 GitHub 账号登录</h2></div>
    <p class="note">
      只读取你的用户名来判断你是不是管理员，<b>不需要任何仓库权限</b>。
      白名单由服务端 <code>ADMIN_LOGIN</code> 决定，没配就谁都进不来。
    </p>
    <button class="btn primary" id="adminLogin" type="button">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor"
                                                                               d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
      用 GitHub 登录
    </button>
    <p class="note small" id="gateMsg"></p>
  </section>

  <!-- 队列 -->
  <section id="board" hidden>
    <div class="bar">
      <span id="who"></span>
      <button class="mini" id="reload" type="button">刷新</button>
      <a class="mini" href="index.html">投稿页</a>
    </div>

    <!-- 加载失败的提示。放在这里而不是只写进抽屉（抽屉是关着的），
         否则出错时页面一片空白，看不出任何原因。 -->
    <p class="list-err" id="listErr" hidden></p>

    <div id="empty" class="empty" hidden>
      <b>队列是空的</b>
      <span>还没有待审核的投稿。</span>
    </div>

    <ul class="queue" id="queue"></ul>
  </section>

</div>

<!-- 详情抽屉 -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-bg" id="drawerBg"></div>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <button class="drawer-close" id="drawerClose" type="button" aria-label="关闭">&times;</button>
    <h2 id="dTitle">投稿详情</h2>
    <div id="dBody"></div>
    <div class="drawer-actions">
      <button class="btn primary" id="btnPublish" type="button">发布（建 PR）</button>
      <button class="btn primary alt" id="btnPublishDirect" type="button">直接提交（不建 PR）</button>
      <button class="btn ghost" id="btnReject" type="button">拒绝</button>
    </div>
    <label class="field">
      <span>审核备注（会记在 PR 里；拒绝时也会给投稿人看）</span>
      <textarea id="adminNote" rows="2" placeholder="可选"></textarea>
    </label>
    <p class="note small" id="dMsg"></p>
  </div>
</div>

<script src="assets/admin.js"></script>
</body>
</html>
